<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karpathy Interview Insights Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .card h3 {
            color: #667eea;
            font-size: 1.2em;
            margin-bottom: 15px;
        }

        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            color: #764ba2;
            margin: 10px 0;
        }

        .stat-label {
            color: #666;
            font-size: 0.9em;
        }

        .topics-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .topic-tag {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 0.9em;
            cursor: pointer;
            transition: all 0.3s;
        }

        .topic-tag:hover {
            transform: scale(1.05);
        }

        .topic-tag.active {
            box-shadow: 0 0 15px rgba(102, 126, 234, 0.5);
        }

        .insights-section {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
        }

        .insights-section h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.8em;
        }

        .insight-item {
            border-left: 4px solid #667eea;
            padding: 20px;
            margin-bottom: 15px;
            background: #f8f9fa;
            border-radius: 5px;
            transition: all 0.3s;
        }

        .insight-item:hover {
            background: #f0f2f8;
            border-left-color: #764ba2;
        }

        .insight-title {
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
            font-size: 1.1em;
        }

        .insight-content {
            color: #555;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .insight-meta {
            display: flex;
            gap: 15px;
            font-size: 0.85em;
            color: #888;
            flex-wrap: wrap;
        }

        .insight-tag {
            background: #e9ecef;
            padding: 3px 10px;
            border-radius: 3px;
            font-size: 0.8em;
        }

        .filter-section {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .filter-section h3 {
            color: #667eea;
            margin-bottom: 15px;
        }

        .search-box {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e9ecef;
            border-radius: 5px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .search-box:focus {
            outline: none;
            border-color: #667eea;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        footer {
            text-align: center;
            color: white;
            padding: 20px;
            opacity: 0.9;
        }

        .refresh-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s;
        }

        .refresh-btn:hover {
            background: #764ba2;
            transform: scale(1.05);
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 1.8em;
            }

            .insights-section {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎯 Karpathy Interview Insights</h1>
            <p>AI & Technology Insights from Andrej Karpathy</p>
        </header>

        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-label">Total Insights</div>
                <div class="stat-number" id="totalInsights">6</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Topics Covered</div>
                <div class="stat-number" id="totalTopics">6</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Key Sources</div>
                <div class="stat-number" id="totalSources">5</div>
            </div>
        </div>

        <div class="filter-section">
            <h3>🔍 Search & Filter</h3>
            <input type="text" class="search-box" id="searchBox" placeholder="Search insights by keyword, topic, or source...">
            <div class="topics-container" id="topicsFilter" style="margin-top: 20px;"></div>
        </div>

        <div class="insights-section">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2>💡 Key Insights</h2>
                <button class="refresh-btn" onclick="loadInsights()">Refresh</button>
            </div>
            <div id="insightsContainer"></div>
        </div>

        <footer>
            <p>Last updated: <span id="timestamp"></span></p>
            <p>Data source: Andrej Karpathy's public interviews & talks</p>
        </footer>
    </div>

    <script>
        // Sample data - in production, this would come from an API
        const insights = [
            {
                topic: "Neural Networks Foundation",
                content: "Neural networks are not magic, they're just mathematical functions that we optimize through backpropagation",
                source: "Neural Networks Zero to Hero",
                timestamp: "2024",
                tags: ["neural_networks", "education"]
            },
            {
                topic: "Tesla Autonomy Approach",
                content: "We use real-world data from Tesla fleet to train end-to-end neural networks for autonomous driving",
                source: "Tesla AI Day 2021",
                timestamp: "2021",
                tags: ["autonomous_driving", "neural_networks"]
            },
            {
                topic: "LLM Capabilities & Limitations",
                content: "LLMs are incredible at pattern recognition but they lack true reasoning and world modeling",
                source: "Lex Fridman Podcast",
                timestamp: "2023",
                tags: ["llm", "reasoning"]
            },
            {
                topic: "AI Education",
                content: "The best way to learn AI is to build projects, start simple and iterate",
                source: "Various Interviews",
                timestamp: "2024",
                tags: ["ai_education", "learning"]
            },
            {
                topic: "Multimodal Future",
                content: "The next wave of AI will integrate vision, language, and reasoning capabilities",
                source: "AI Conference 2024",
                timestamp: "2024",
                tags: ["multimodal", "llm"]
            },
            {
                topic: "Safety and Interpretability",
                content: "We need better interpretability tools to understand what large models are doing",
                source: "AI Safety Discussion",
                timestamp: "2024",
                tags: ["safety", "interpretability"]
            }
        ];

        const topicLabels = {
            llm: "Large Language Models",
            autonomous_driving: "Autonomous Driving",
            neural_networks: "Neural Networks",
            ai_education: "AI Education",
            safety: "Safety & Ethics",
            reasoning: "Reasoning",
            multimodal: "Multimodal AI",
            learning: "Learning"
        };

        let filteredInsights = [...insights];
        let selectedTopics = new Set();

        function initializeUI() {
            updateStats();
            renderTopicFilters();
            renderInsights();
            updateTimestamp();
        }

        function updateStats() {
            document.getElementById('totalInsights').textContent = insights.length;
            const uniqueTopics = new Set(insights.flatMap(i => i.tags));
            document.getElementById('totalTopics').textContent = uniqueTopics.size;
            const uniqueSources = new Set(insights.map(i => i.source));
            document.getElementById('totalSources').textContent = uniqueSources.size;
        }

        function renderTopicFilters() {
            const container = document.getElementById('topicsFilter');
            const uniqueTopics = [...new Set(insights.flatMap(i => i.tags))];

            container.innerHTML = uniqueTopics.map(tag => `
                <div class="topic-tag" onclick="toggleTopic('${tag}')" id="tag-${tag}">
                    ${topicLabels[tag] || tag.replace('_', ' ')}
                </div>
            `).join('');
        }

        function toggleTopic(topic) {
            const tagElement = document.getElementById(`tag-${topic}`);

            if (selectedTopics.has(topic)) {
                selectedTopics.delete(topic);
                tagElement.classList.remove('active');
            } else {
                selectedTopics.add(topic);
                tagElement.classList.add('active');
            }

            applyFilters();
        }

        function applyFilters() {
            const searchTerm = document.getElementById('searchBox').value.toLowerCase();

            filteredInsights = insights.filter(insight => {
                const matchesSearch = !searchTerm ||
                    insight.topic.toLowerCase().includes(searchTerm) ||
                    insight.content.toLowerCase().includes(searchTerm) ||
                    insight.source.toLowerCase().includes(searchTerm);

                const matchesTopic = selectedTopics.size === 0 ||
                    insight.tags.some(tag => selectedTopics.has(tag));

                return matchesSearch && matchesTopic;
            });

            renderInsights();
        }

        function renderInsights() {
            const container = document.getElementById('insightsContainer');

            if (filteredInsights.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #999;">No insights found. Try different filters.</p>';
                return;
            }

            container.innerHTML = filteredInsights.map(insight => `
                <div class="insight-item">
                    <div class="insight-title">🎯 ${insight.topic}</div>
                    <div class="insight-content">"${insight.content}"</div>
                    <div class="insight-meta">
                        <span>📚 <strong>${insight.source}</strong></span>
                        <span>📅 ${insight.timestamp}</span>
                        ${insight.tags.map(tag => `<span class="insight-tag">${topicLabels[tag] || tag}</span>`).join('')}
                    </div>
                </div>
            `).join('');
        }

        function loadInsights() {
            const container = document.getElementById('insightsContainer');
            container.innerHTML = '<div class="loading"><div class="spinner"></div>Loading insights...</div>';

            // Simulate loading
            setTimeout(() => {
                applyFilters();
            }, 500);
        }

        function updateTimestamp() {
            const now = new Date();
            document.getElementById('timestamp').textContent = now.toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // Event listeners
        document.getElementById('searchBox').addEventListener('keyup', applyFilters);

        // Initialize on load
        window.addEventListener('load', initializeUI);
    </script>
</body>
</html>
